<!DOCTYPE html>
<html lang="en" class="no.js">
  <head>
    {% load i18n %}
    {% load static %}
      <meta charset="utf-8" />
      <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
      <meta name="viewport" content="width=device-width, initial-scale=1"/>
      <meta name="robots" content="noindex, follow">
      <title>{% block title %}Registration — Winter Acro Festival{% endblock title %}</title>
      <meta name="description" content="{% block meta_description %}Registration form for the Winter Acro Festival.{% endblock meta_description %}" />
      <meta name="author" content="Acrolama" />
      <link rel="canonical" href="{% block canonical_url %}{{ request.scheme }}://{{ request.get_host }}{{ request.path }}{% endblock canonical_url %}">
      {% include 'pages/formulario/snippets/cssform.html' %}
  </head>
    <body>
            {% block content %}{% endblock content %}
            {% include 'pages/formulario/snippets/jsform.html' %}
    </body>
</html>
